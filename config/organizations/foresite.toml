# InsightNet organization profile. Update this file to change one center.

[organization]
id = "foresite"
name = "Forecasting and Surveillance of Infectious Threats and Epidemics"
acronym = "ForeSITE"
summary = "ForeSITE is an InsightNet Integration Center that collaborates with health departments and healthcare organizations to implement and evaluate outbreak analytics and infectious disease modeling tools."
website = "https://epiforesite.github.io/ForeSITE_Website/"
location = "Utah, Washington"
focus_areas = [ "outbreak analytics", "infectious disease modeling", "forecasting and nowcasting", "public health decision support",]
enabled = true
[[organization.researchers]]
id = "eric-lofgren"
full_name = "Eric Lofgren"
role = "Principal Investigator"
bio = "Infectious disease epidemiologist whose research uses mathematical and computational models of disease transmission, including antimicrobial-resistant and emerging infections."
expertise = [ "infectious disease epidemiology", "mathematical modeling", "computational modeling", "antimicrobial resistance",]
website = "https://epiforesite.github.io/ForeSITE_Website/members/eric-lofgren.html"

[[organization.researchers]]
id = "lindsay-keegan"
full_name = "Lindsay Keegan"
role = "Principal Investigator"
bio = "Develops and applies mathematical and statistical methods to understand infectious disease dynamics and support outbreak decision making with public health and healthcare partners."
expertise = [ "mathematical methods", "statistical methods", "infectious disease dynamics", "decision support",]
website = "https://epiforesite.github.io/ForeSITE_Website/members/lindsay-keegan.html"

[[organization.researchers]]
id = "makoto-jones"
full_name = "Makoto Jones"
role = "Principal Investigator"
bio = "Infectious disease internist focused on diagnosing and treating nosocomial pathogens and evidence-based antimicrobial prescribing."
expertise = [ "infectious diseases", "nosocomial pathogens", "antimicrobial prescribing",]
website = "https://epiforesite.github.io/ForeSITE_Website/members/makoto-jones.html"

[[organization.researchers]]
id = "matthew-samore"
full_name = "Matthew Samore"
role = "Principal Investigator"
bio = "Professor of Medicine and Division Chief of Epidemiology at the University of Utah with expertise in epidemiologic methods, electronic surveillance, and decision-support systems."
expertise = [ "epidemiology", "electronic surveillance", "decision-support systems", "health informatics",]
website = "https://epiforesite.github.io/ForeSITE_Website/members/matt-samore.html"

[[organization.researchers]]
id = "mike-rubin"
full_name = "Mike Rubin"
role = "Principal Investigator"
bio = "Infectious disease and hospital epidemiology clinician focused on preventable healthcare-associated infections, including multidrug-resistant organisms."
expertise = [ "infectious diseases", "hospital epidemiology", "healthcare-associated infections", "antimicrobial resistance",]
website = "https://epiforesite.github.io/ForeSITE_Website/members/michael-rubin.html"

