name = "SOAR Platform"
summary = "Disease monitoring platform for state, tribal, local, and territorial health departments, built by International Responder Systems. Integrates the UCSC Genomics Institute's Cluster Tracker and UShER modules for viral transmission and outbreak investigation, alongside disease forecasting, dashboards, and lab result validation."
url = "https://www.internationalrespondersystems.com/solutions/soar"
category = "platform"
keywords = ["outbreak investigation", "genomic surveillance", "forecasting", "health departments"]

