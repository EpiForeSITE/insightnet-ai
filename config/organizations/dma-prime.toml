[organization]
id = "dma-prime"
name = "Disease Modeling and Analytics to Inform Outbreak Preparedness, Response, Intervention, Mitigation, and Elimination"
acronym = "DMA-PRIME"
summary = "DMA-PRIME uses data-driven approaches for infectious disease forecasting, decision-support toolkits, and communication of analytic results to public health organizations and decision-makers."
website = "https://dma-prime.org/"
location = "South Carolina"
focus_areas = [ "infectious disease forecasting", "outbreak analytics", "decision support", "data visualization", "public health response",]
keywords = [ "electronic health records", "wastewater surveillance", "digital trace data", "mobile health clinics",]
enabled = true
