[organization]
id = "cidmath"
name = "Emory Center for Infectious Disease Modeling & Analytics and Training Hub"
acronym = "CIDMATH"
summary = "CIDMATH advances infectious disease modeling and outbreak forecasting with technology that is accessible and usable by public health practitioners."
website = "https://cidmath.org/"
location = "Georgia"
focus_areas = [ "infectious disease modeling", "outbreak forecasting", "wastewater epidemiology", "vaccine evaluation", "machine learning", "training",]
keywords = [ "social contact patterns", "flu forecasting", "public health practitioners",]
enabled = true

